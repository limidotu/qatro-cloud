name: Publish Qatro controls
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: qatro-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set the public connection settings
        env:
          QATRO_CLOUD_READY: ${{ vars.QATRO_CLOUD_READY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('site/config.json').write_text(json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'],
              'cloudReady': os.environ.get('QATRO_CLOUD_READY') == 'true'
          }) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Publish the control page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
